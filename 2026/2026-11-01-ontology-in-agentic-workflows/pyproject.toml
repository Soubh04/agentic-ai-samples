[project]
name = "ontology-in-agentic-workflows"
version = "0.1.0"
description = "Sample: ground an agent in an ontology in six layers, from OWL classes and SKOS synonyms to generated tool enums and a SHACL gate."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23",
    "pyshacl>=0.30",
    "rdflib>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# This is a runnable sample, not a distributable library: do not build or install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
