[project]
name = "types-of-rag"
version = "0.1.0"
description = "Sample: four types of RAG (CAG, naive, hybrid with RRF, corrective) side by side, with your own Azure OpenAI or Foundry resource."
requires-python = ">=3.10"
dependencies = [
    "openai>=2,<3",
    "azure-identity>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# This is a runnable sample, not a distributable library: do not build or install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
