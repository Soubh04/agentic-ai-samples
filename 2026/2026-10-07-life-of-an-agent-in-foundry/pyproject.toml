[project]
name = "life-of-an-agent-in-foundry"
version = "0.1.0"
description = "Sample: the life of an AI agent in Microsoft Foundry (build, test, evaluate, route, roll back) with your own Foundry project."
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=2.8,<3",
    "azure-identity>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# This is a runnable sample, not a distributable library: do not build or install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
